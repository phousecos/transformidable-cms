# Copies every media file from Vercel Blob to the Cloudflare R2 bucket, for
# the move off Vercel. Run it from GitHub: Actions → Copy media to R2 → Run
# workflow. Safe to run more than once; files are overwritten with the same
# bytes. See docs/cloudflare-cutover.md, Part 4.1.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   BLOB_READ_WRITE_TOKEN   Vercel → project → Storage → the Blob store
#   CLOUDFLARE_API_TOKEN    Cloudflare token with "Workers R2 Storage: Edit"
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare → Workers & Pages → Account ID
name: Copy media to R2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be copied"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Copy
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run media:copy-to-r2 -- ${{ inputs.dry_run && '--dry-run' || '' }}
